<section class="contact-section">
    <h2>Say Hi!</h2>
    <div class="contact">
        <header class="contact-header">
            <h3>Want to discuss a new project?</h3>
            <p>Say hello! Let's discuss your ideas and make it happen.</p>
        </header>
        <form class="form">
            <input type="text" placeholder="Your name">
            <input type="text" placeholder="Your email">
            <textarea name="message" placeholder="Your message" id=""></textarea>
            <label class="checkbox">
                <span class="checkbox-visual">
                    <input type="checkbox">
                    <span class="checkmark"></span>
                </span>
                <p>
                    I've read the <a [routerLink]="'/privacy-policy'" data-text="privacy policy" class="privacy">privacy policy</a> and agree to
                    the processing
                    of my data as outlined.
                </p>
            </label>
            <button>Send message</button>
        </form>
    </div>
</section>

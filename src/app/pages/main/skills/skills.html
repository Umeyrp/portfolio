<section class="skills-section">
    <div class="skills-wrapper">
        <h2>{{"app.mySkills" | translate}}</h2>
        <div class="skills-item-wrapper">
            @for (skill of skills; track $index) {
            <div class="skills-item">
                <div class="icon-wrapper">
                    <img src="/images/skills_logos/{{skill}}-logo.svg" alt="">
                </div>
                <p>{{skill}}</p>
            </div>
            }
        </div>
        <div class="contact-me-wrapper">
            <div class="icon-wrapper">
                <img src="/images/skills-hat.svg" alt="">
            </div>
            <p>{{"app.skills-text-1" |translate}}
                <span (click)="scrollToSection('contact')" data-text-1="Kontaktiere mich" data-text-2="Contact me">{{"app.contactMe"
                    |translate}}</span>{{"app.skills-text-2" |translate}}
            </p>
        </div>
    </div>
</section>

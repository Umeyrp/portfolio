<section class="skills-section">
    <div class="skills-wrapper">
        <h2>{{"app.MySkills" | translate}}</h2>
        <div class="skills-item-wrapper">
            @for (skill of skills; track $index) {
            <div class="skills-item">
                <div class="icon-wrapper">
                    <img src="/images/skills_logos/{{skill}}-logo.svg" alt="">
                </div>
                <p>{{skill}}</p>
            </div>
            }
        </div>
        <div class="contact-me-wrapper">
            <div class="icon-wrapper">
                <img src="/images/skills-hat.svg" alt="">
            </div>
            <p>Don't see the skill you need? <span data-text="Contact me">Contact me</span> I'm always ready to learn!
            </p>
        </div>
    </div>
</section>
